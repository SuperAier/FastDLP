[package]
name = "fastdlp"
version = "0.1.0"
edition = "2021"
authors = ["FastDLP Team"]
description = "Fast Data Loss Prevention - Rust implementation of openDLP"
license = "Apache-2.0"
repository = "https://github.com/fastdlp/fastdlp"
keywords = ["privacy", "dlp", "data-protection", "sensitive-data-discovery"]
categories = ["security"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# Data processing
csv = "1.3"
polars = { version = "0.35", features = ["lazy", "csv", "json"] }
regex = "1.10"
fancy-regex = "0.11"

# Machine learning and NLP
candle-core = "0.3"
candle-nn = "0.3"
candle-transformers = "0.3"
tch = "0.13"
tokenizers = "0.15"

# Async and HTTP
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"

# Utility
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
rand = "0.8"

# Database (optional)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "sqlite"], optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"
pretty_assertions = "1.4"

[features]
default = ["database"]
database = ["sqlx"]

[[bin]]
name = "fastdlp"
path = "src/main.rs"

[lib]
name = "fastdlp"
path = "src/lib.rs"

[[bench]]
name = "benchmark"
harness = false 